aid: fountain
name: Fountain
description: >-
  Fountain is an AI-powered frontline workforce management platform used by 500+
  enterprise employers across retail, logistics, hospitality, healthcare, and food
  service to source, hire, onboard, schedule, and retain high-volume hourly workers.
  Its developer platform exposes a REST API — the Hire v2 API plus newer Workforce,
  Attendance, Scheduling, Compliance, Referral, Pool, and Pulse microservices — for
  programmatically managing applicants, openings, positions, locations, interview
  slots, workers, documents, custom attributes, and data exports. Authentication is
  OAuth2 client-credentials (with a legacy X-ACCESS-TOKEN key model on tenant hosts),
  webhooks are HMAC-SHA-256 signed, requests are rate limited to 120/minute, and
  deprecations are signaled with RFC 8594 Sunset headers.
