throttled_body: 'Too many API requests.'
headers:
- name: X-Api-Ratelimit-Limit
  meaning: Maximum requests per minute allowed.
- name: X-Api-Ratelimit-Limit-Remaining
  meaning: Requests remaining in the current window.
- name: X-Api-Ratelimit-Reset
  meaning: Unix timestamp when the current window resets.
rate_limits:
- limit_count: 120
  interval: 60
  unit: minute
  scope: default per-account
